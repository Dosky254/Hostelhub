<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostelHub | Welcome</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .welcome-section {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px 20px;
        }

        .welcome-content {
            max-width: 650px;
        }

        .welcome-content h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .welcome-content p {
            font-size: 18px;
            margin-bottom: 30px;
        }

        .welcome-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .welcome-buttons a {
            text-decoration: none;
        }
    </style>
</head>
<body>

<header>
    <nav class="navbar">
        <h2>Hostel<span>Hub</span></h2>
        <div class="nav-links">
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </div>
    </nav>
</header>

<section class="welcome-section">
    <div class="welcome-content">
        <h1>Welcome to HostelHub</h1>
        <p>
            Find comfortable and affordable student accommodation.
            Register or log in to explore hostels, make bookings
            and manage your payments.
        </p>

        <div class="welcome-buttons">
            <a href="register.html" class="btn">Create Account</a>
            <a href="login.html" class="btn">Login</a>
        </div>
    </div>
</section>

<footer>
    <h3>HostelHub</h3>
    <p>Find your space. Book your stay.</p>
    <p>© 2026 HostelHub. All rights reserved.</p>
</footer>

</body>
</html>
