<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Hostel | HostelHub</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .booking-container {
            max-width: 650px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        }

        .booking-container h1 {
            text-align: center;
        }

        .booking-container input,
        .booking-container select {
            width: 100%;
            padding: 13px;
            margin: 10px 0 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .booking-container label {
            font-weight: bold;
        }

        .booking-container button {
            width: 100%;
            cursor: pointer;
        }

        #booking-message {
            text-align: center;
            margin-top: 15px;
        }

        #selected-hostel {
            padding: 15px;
            background: #f1f7f3;
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<header>
    <nav class="navbar">
        <h2>Hostel<span>Hub</span></h2>

        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="hostels.html">Hostels</a>
            <a href="my-bookings.html">My Bookings</a>
            <button class="btn" onclick="logout()">Logout</button>
        </div>
    </nav>
</header>

<div class="booking-container">

    <h1>Book Your Hostel</h1>
    <p>Complete the form below to submit your booking.</p>

    <div id="selected-hostel">
        Loading selected hostel...
    </div>

    <form id="booking-form">

        <label>Full Name</label>
        <input type="text" id="customer_name" required>

        <label>Email Address</label>
        <input type="email" id="email" required>

        <label>Phone Number</label>
        <input type="tel" id="phone" required>

        <input type="hidden" id="hostel_id">

        <label>Check-in Date</label>
        <input type="date" id="check_in" required>

        <label>Check-out Date</label>
        <input type="date" id="check_out" required>

        <label>Preferred Payment Method</label>
        <select id="payment_method" required>
            <option value="">Select Payment Method</option>
            <option value="M-Pesa">M-Pesa</option>
            <option value="Card">Card</option>
        </select>

        <button type="submit" class="btn">Submit Booking</button>

        <p id="booking-message"></p>

    </form>
</div>

<footer>
    <h3>HostelHub</h3>
    <p>Find your space. Book your stay.</p>
    <p>© 2026 HostelHub. All rights reserved.</p>
</footer>

<script>
    const token = localStorage.getItem("hostelhub_token");

    if (!token) {
        window.location.replace("login.html");
    }

    function logout() {
        localStorage.removeItem("hostelhub_token");
        localStorage.removeItem("hostelhub_user");
        window.location.replace("login.html");
    }

    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[char]);
    }

    async function loadSelectedHostel() {
        const hostelId = new URLSearchParams(window.location.search)
            .get("hostel_id");

        const selectedHostel = document.getElementById("selected-hostel");
        const hostelInput = document.getElementById("hostel_id");

        if (!hostelId) {
            selectedHostel.textContent = "Please select a hostel from the Hostels page.";
            return;
        }

        try {
            const response = await fetch("/api/hostels");

            if (!response.ok) throw new Error("Unable to load hostel details.");

            const hostels = await response.json();

            const hostel = hostels.find(item =>
                String(item.id) === String(hostelId)
            );

            if (!hostel) throw new Error("Selected hostel was not found.");

            hostelInput.value = hostel.id;

            selectedHostel.innerHTML = `
                <h3>${escapeHTML(hostel.name)}</h3>
                <p>📍 ${escapeHTML(hostel.location)}</p>
                <strong>KSh ${Number(hostel.price).toLocaleString("en-KE")} / semester</strong>
            `;

        } catch (error) {
            selectedHostel.textContent = error.message;
        }
    }

    // Fill customer details from the logged-in account
    const user = JSON.parse(localStorage.getItem("hostelhub_user") || "{}");

    document.getElementById("customer_name").value =
        user.full_name || user.name || "";

    document.getElementById("email").value = user.email || "";

    loadSelectedHostel();

    document.getElementById("booking-form").addEventListener("submit", async function(event) {
        event.preventDefault();

        const message = document.getElementById("booking-message");
        const submitButton = this.querySelector("button[type='submit']");

        if (!document.getElementById("hostel_id").value) {
            message.textContent = "Please select a valid hostel.";
            return;
        }

        const booking = {
            customer_name: document.getElementById("customer_name").value,
            email: document.getElementById("email").value,
            phone: document.getElementById("phone").value,
            hostel_id: document.getElementById("hostel_id").value,
            check_in: document.getElementById("check_in").value,
            check_out: document.getElementById("check_out").value,
            payment_method: document.getElementById("payment_method").value
        };

        submitButton.disabled = true;
        message.textContent = "Submitting booking...";

        try {
            const response = await fetch("/api/bookings", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify(booking)
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.message || "Booking failed.");
            }

            message.textContent = "Booking submitted successfully! Reference #" +
                result.bookingId + ". Awaiting approval.";

            this.reset();

            document.getElementById("customer_name").value =
                user.full_name || user.name || "";

            document.getElementById("email").value = user.email || "";

            document.getElementById("hostel_id").value = booking.hostel_id;

        } catch (error) {
            message.textContent = error.message;
        } finally {
            submitButton.disabled = false;
        }
    });
</script>

</body>
</html>
